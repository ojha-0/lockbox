<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Sewa — KYC API Test Client</title>
  <meta name="description" content="API testing front-end for KYC verification." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       Nexus design tokens
       ========================================================================== */
    :root {
      --color-primary: #01696f;
      --color-primary-hover: #015257;
      --color-primary-active: #013d41;
      --color-primary-subtle: #e6f2f3;
      --color-primary-on: #ffffff;

      --color-bg: #f7f8f9;
      --color-surface: #ffffff;
      --color-surface-alt: #fafbfc;
      --color-border: #e5e7eb;
      --color-border-strong: #d1d5db;

      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-text-subtle: #64748b;

      --color-success: #047857;
      --color-success-subtle: #d1fae5;
      --color-warning: #b45309;
      --color-warning-subtle: #fef3c7;
      --color-danger: #b91c1c;
      --color-danger-subtle: #fee2e2;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 999px;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 6px rgba(15, 23, 42, 0.05), 0 10px 20px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.10), 0 20px 50px rgba(15, 23, 42, 0.12);

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;

      --text-xs: 12px;
      --text-sm: 13px;
      --text-base: 14px;
      --text-md: 15px;
      --text-lg: 17px;
      --text-xl: 20px;

      --font-display: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, sans-serif;

      --ring: 0 0 0 3px rgba(1, 105, 111, 0.25);
      --transition: 150ms ease;
    }

    [data-theme='dark'] {
      --color-primary: #2dd4bf;
      --color-primary-hover: #5eead4;
      --color-primary-active: #14b8a6;
      --color-primary-subtle: rgba(45, 212, 191, 0.12);
      --color-primary-on: #042f2e;

      --color-bg: #0b1012;
      --color-surface: #11171a;
      --color-surface-alt: #161d21;
      --color-border: #222b30;
      --color-border-strong: #2f3a40;

      --color-text: #f1f5f9;
      --color-text-muted: #cbd5e1;
      --color-text-subtle: #94a3b8;

      --color-success: #34d399;
      --color-success-subtle: rgba(52, 211, 153, 0.12);
      --color-warning: #fbbf24;
      --color-warning-subtle: rgba(251, 191, 36, 0.12);
      --color-danger: #f87171;
      --color-danger-subtle: rgba(248, 113, 113, 0.14);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 6px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.55);

      --ring: 0 0 0 3px rgba(45, 212, 191, 0.35);
    }

    /* ==========================================================================
       Base resets
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      transition: background-color var(--transition), color var(--transition);
    }
    body.signup-bg {
      background:
        radial-gradient(circle at 12% 18%, rgba(1, 105, 111, 0.10), transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(1, 105, 111, 0.08), transparent 45%),
        var(--color-bg);
    }
    [data-theme='dark'] body.signup-bg {
      background:
        radial-gradient(circle at 12% 18%, rgba(45, 212, 191, 0.12), transparent 40%),
        radial-gradient(circle at 88% 82%, rgba(45, 212, 191, 0.08), transparent 45%),
        var(--color-bg);
    }
    h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.3; color: var(--color-text); }
    h1 { font-size: var(--text-xl); font-weight: 700; }
    h2 { font-size: var(--text-lg); font-weight: 700; }
    h3 { font-size: var(--text-md); font-weight: 600; }
    p  { margin: 0; }
    a  { color: var(--color-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }

    button { font-family: inherit; }
    input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

    /* ==========================================================================
       Layout shells
       ========================================================================== */
    main { min-height: 100%; }

    .app-shell {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .signup-shell {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6) var(--space-4);
    }

    /* ==========================================================================
       Header
       ========================================================================== */
    .app-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-6);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      backdrop-filter: saturate(180%) blur(8px);
    }
    .brand { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-text); }
    .brand-text { font-family: var(--font-display); font-weight: 700; font-size: var(--text-md); letter-spacing: -0.01em; }
    .header-spacer { flex: 1; }
    .user-chip {
      display: inline-flex; align-items: center; gap: var(--space-2);
      padding: var(--space-1) var(--space-3);
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }
    .user-chip strong { color: var(--color-text); font-weight: 600; }

    /* ==========================================================================
       Card
       ========================================================================== */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: var(--space-6);
    }
    .card + .card { margin-top: var(--space-4); }
    .card-heading { margin-bottom: var(--space-5); }
    .card-heading p { color: var(--color-text-muted); font-size: var(--text-sm); margin-top: var(--space-1); }

    /* ==========================================================================
       Forms
       ========================================================================== */
    .form-grid { display: grid; gap: var(--space-4); }
    .field { display: flex; flex-direction: column; gap: var(--space-2); }
    .field label {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text);
    }
    .input, .select {
      height: 44px;
      padding: 0 var(--space-3);
      font-size: var(--text-base);
      color: var(--color-text);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 100%;
    }
    .input::placeholder { color: var(--color-text-subtle); }
    .input:hover, .select:hover { border-color: var(--color-border-strong); }
    .input:focus, .select:focus { outline: none; border-color: var(--color-primary); box-shadow: var(--ring); }
    .input[aria-invalid='true'] { border-color: var(--color-danger); }
    .input[aria-invalid='true']:focus { box-shadow: 0 0 0 3px var(--color-danger-subtle); }
    .helper { font-size: var(--text-xs); color: var(--color-text-subtle); }
    .helper.error { color: var(--color-danger); }

    .input-with-toggle { position: relative; }
    .input-with-toggle .input { padding-right: 44px; }
    .input-with-toggle .toggle {
      position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
      width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--color-text-subtle); cursor: pointer;
      border-radius: var(--radius-sm);
    }
    .input-with-toggle .toggle:hover { color: var(--color-text); background: var(--color-surface-alt); }
    .input-with-toggle .toggle:focus-visible { outline: none; box-shadow: var(--ring); }

    /* ==========================================================================
       Buttons
       ========================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      height: 44px; padding: 0 var(--space-5);
      font-size: var(--text-sm); font-weight: 600;
      border: 1px solid transparent; border-radius: var(--radius-md);
      cursor: pointer; user-select: none;
      transition: background-color var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn:focus-visible { outline: none; box-shadow: var(--ring); }
    .btn:active:not(:disabled) { transform: translateY(1px); }

    .btn-primary { background: var(--color-primary); color: var(--color-primary-on); }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn-primary:active:not(:disabled) { background: var(--color-primary-active); }

    .btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
    .btn-secondary:hover:not(:disabled) { background: var(--color-surface-alt); border-color: var(--color-border-strong); }

    .btn-ghost { background: transparent; color: var(--color-text-muted); }
    .btn-ghost:hover:not(:disabled) { background: var(--color-surface-alt); color: var(--color-text); }

    .btn-block { width: 100%; }
    .btn-sm { height: 36px; padding: 0 var(--space-3); font-size: var(--text-xs); }
    .btn-icon {
      width: 36px; height: 36px; padding: 0;
      background: var(--color-surface); border: 1px solid var(--color-border);
      color: var(--color-text-muted); border-radius: var(--radius-md);
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      transition: background-color var(--transition), color var(--transition);
    }
    .btn-icon:hover { background: var(--color-surface-alt); color: var(--color-text); }
    .btn-icon:focus-visible { outline: none; box-shadow: var(--ring); }

    /* ==========================================================================
       Badges / chips
       ========================================================================== */
    .chip {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: 2px var(--space-2);
      font-size: var(--text-xs); font-weight: 600;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
    }
    .chip-primary { background: var(--color-primary-subtle); color: var(--color-primary); border-color: transparent; }
    .chip-warning { background: var(--color-warning-subtle); color: var(--color-warning); }
    .chip-success { background: var(--color-success-subtle); color: var(--color-success); }
    .chip-neutral { background: var(--color-surface-alt); color: var(--color-text-muted); border-color: var(--color-border); }

    /* ==========================================================================
       Signup card
       ========================================================================== */
    .signup-card { width: 100%; max-width: 440px; }
    .signup-card .brand-row {
      display: flex; flex-direction: column; align-items: center;
      gap: var(--space-3); margin-bottom: var(--space-6);
      text-align: center;
    }
    .signup-card h1 { font-size: var(--text-xl); }
    .signup-card .subtitle { color: var(--color-text-muted); font-size: var(--text-sm); }
    .signup-footer { margin-top: var(--space-4); text-align: center; font-size: var(--text-sm); color: var(--color-text-muted); }
    .signup-corner-toggle { position: absolute; top: var(--space-4); right: var(--space-4); }

    /* ==========================================================================
       Dashboard
       ========================================================================== */
    .dashboard-main { flex: 1; max-width: 640px; width: 100%; margin: 0 auto; padding: var(--space-6) var(--space-4); }
    .welcome-card .info-rows { display: grid; gap: var(--space-2); margin-top: var(--space-4); }
    .info-row { display: flex; justify-content: space-between; padding: var(--space-3); background: var(--color-surface-alt); border-radius: var(--radius-md); font-size: var(--text-sm); }
    .info-row span:first-child { color: var(--color-text-subtle); }
    .info-row span:last-child  { color: var(--color-text); font-weight: 500; }
    .status-row { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-4); }
    .status-row .label { font-size: var(--text-sm); color: var(--color-text-muted); }

    .section-heading { margin: var(--space-8) 0 var(--space-4); }
    .kyc-options { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    @media (max-width: 640px) { .kyc-options { grid-template-columns: 1fr; } }
    .option-card {
      display: flex; flex-direction: column; gap: var(--space-3);
      padding: var(--space-6);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .option-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-md); }
    .option-icon {
      width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
      background: var(--color-primary-subtle); color: var(--color-primary);
      border-radius: var(--radius-md);
    }
    .option-title-row { display: flex; align-items: center; gap: var(--space-2); }
    .option-desc { color: var(--color-text-muted); font-size: var(--text-sm); flex: 1; }

    /* ==========================================================================
       KYC views
       ========================================================================== */
    .kyc-main { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding: var(--space-6) var(--space-4); }
    .kyc-main.narrow { max-width: 480px; }
    .back-link { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); margin-bottom: var(--space-4); color: var(--color-text-muted); }
    .back-link:hover { color: var(--color-text); text-decoration: none; }

    .dropzone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--space-2); padding: var(--space-6);
      text-align: center;
      background: var(--color-surface-alt);
      border: 1.5px dashed var(--color-border-strong);
      border-radius: var(--radius-md);
      color: var(--color-text-muted);
      cursor: pointer; font-size: var(--text-sm);
      transition: border-color var(--transition), background-color var(--transition), color var(--transition);
    }
    .dropzone:hover, .dropzone.drag-over { border-color: var(--color-primary); color: var(--color-text); background: var(--color-primary-subtle); }
    .dropzone.has-file { border-style: solid; border-color: var(--color-primary); color: var(--color-text); background: var(--color-primary-subtle); }
    .dropzone input[type=file] { display: none; }
    .dropzone .file-name { font-weight: 600; }

    .callout {
      padding: var(--space-4);
      background: var(--color-primary-subtle);
      border: 1px solid transparent;
      border-left: 3px solid var(--color-primary);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--color-text);
      margin-bottom: var(--space-5);
    }
    .callout strong { color: var(--color-primary); }

    /* ==========================================================================
       Success states
       ========================================================================== */
    .success-state { text-align: center; padding: var(--space-8) var(--space-4); }
    .success-state h2 { margin: var(--space-4) 0 var(--space-2); font-size: var(--text-xl); }
    .success-state p { color: var(--color-text-muted); font-size: var(--text-sm); }
    .check-circle {
      width: 72px; height: 72px; margin: 0 auto;
      border-radius: 50%;
      background: var(--color-success-subtle);
      color: var(--color-success);
      display: inline-flex; align-items: center; justify-content: center;
      animation: pop 400ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .check-circle svg { animation: draw 500ms 150ms ease-out both; stroke-dasharray: 40; stroke-dashoffset: 40; }
    @keyframes pop  { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ==========================================================================
       Spinner
       ========================================================================== */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 50%;
      animation: spin 650ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==========================================================================
       Toasts
       ========================================================================== */
    .toast-stack {
      position: fixed; top: var(--space-4); right: var(--space-4);
      display: flex; flex-direction: column; gap: var(--space-2);
      z-index: 50;
    }
    .toast {
      min-width: 260px; max-width: 340px;
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-primary);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      font-size: var(--text-sm);
      display: flex; align-items: center; gap: var(--space-2);
      animation: slide-in 220ms ease-out both;
    }
    .toast.success { border-left-color: var(--color-success); }
    .toast.warning { border-left-color: var(--color-warning); }
    .toast.danger  { border-left-color: var(--color-danger); }
    .toast .icon { color: var(--color-primary); }
    .toast.success .icon { color: var(--color-success); }
    .toast.warning .icon { color: var(--color-warning); }
    .toast.danger  .icon { color: var(--color-danger); }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ==========================================================================
       Utility
       ========================================================================== */
    .row { display: flex; align-items: center; gap: var(--space-3); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .mt-2 { margin-top: var(--space-2); } .mt-4 { margin-top: var(--space-4); } .mt-6 { margin-top: var(--space-6); }
    .hidden { display: none !important; }
    .muted { color: var(--color-text-muted); }
    .center { text-align: center; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

  <script>
  (() => {
    'use strict';

    // ======================================================================
    // icons — inline Lucide-shaped SVG
    // ======================================================================
    const icon = (name, size = 18) => {
      const s = size, stroke = 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
      const paths = {
        sun:    `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>`,
        moon:   `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>`,
        eye:    `<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>`,
        eyeOff: `<path d="M9.88 5.09A10.94 10.94 0 0 1 12 5c6.5 0 10 7 10 7a15.64 15.64 0 0 1-3.1 4.05M6.5 6.5C3.5 8.4 2 12 2 12s3.5 7 10 7a10.9 10.9 0 0 0 4.88-1.09M1 1l22 22M14.12 14.12a3 3 0 1 1-4.24-4.24"/>`,
        check:  `<path d="M20 6 9 17l-5-5"/>`,
        checkBig:`<path d="M20 6 9 17l-5-5" stroke-width="3"/>`,
        logout: `<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>`,
        clipboard:`<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>`,
        shield: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>`,
        upload: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>`,
        arrowLeft: `<path d="M19 12H5M12 19l-7-7 7-7"/>`,
        key:    `<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>`,
        info:   `<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>`,
        alert:  `<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>`,
      };
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 24 24" ${stroke} aria-hidden="true">${paths[name] || ''}</svg>`;
    };

    const logoSVG = (size = 32) => `
      <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="3" y="3" width="34" height="34" rx="10"
              fill="none" stroke="currentColor" stroke-width="2.5" opacity="0.9"/>
        <path d="M12 20.5 17.5 26 28 14"
              fill="none" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;

    // ======================================================================
    // state
    // ======================================================================
    const state = {
      user: null,              // { given_name, family_name, phone, email, user_id }
      kycStatus: 'unverified', // 'unverified' | 'pending' | 'verified'
      theme: 'light',
    };

    // ======================================================================
    // theme
    // ======================================================================
    const applyTheme = (t) => {
      state.theme = t;
      document.documentElement.setAttribute('data-theme', t);
    };
    applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

    const themeToggleBtn = (extraClass = '') => {
      const isDark = state.theme === 'dark';
      return `<button class="btn-icon ${extraClass}" type="button" data-action="toggle-theme"
                title="${isDark ? 'Switch to light' : 'Switch to dark'}"
                aria-label="Toggle color theme">
                ${icon(isDark ? 'sun' : 'moon', 16)}
              </button>`;
    };

    // ======================================================================
    // ui helpers
    // ======================================================================
    const $app = () => document.getElementById('app');

    const toast = (msg, variant = 'default') => {
      const stack = document.getElementById('toast-stack');
      const el = document.createElement('div');
      el.className = `toast ${variant}`;
      el.setAttribute('role', 'status');
      const iconName = variant === 'success' ? 'check' : variant === 'danger' ? 'alert' : 'info';
      el.innerHTML = `<span class="icon">${icon(iconName, 16)}</span><span>${msg}</span>`;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.transition = 'opacity 200ms, transform 200ms';
        el.style.opacity = '0';
        el.style.transform = 'translateX(16px)';
        setTimeout(() => el.remove(), 220);
      }, 3000);
    };

    const escapeHtml = (s) =>
      String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const setBodyClass = (cls) => { document.body.className = cls; };

    const setButtonLoading = (btn, loading, labelWhileLoading = 'Working…') => {
      if (!btn) return;
      if (loading) {
        btn.dataset._label = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span><span>${labelWhileLoading}</span>`;
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset._label || btn.innerHTML;
        delete btn.dataset._label;
      }
    };

    // ======================================================================
    // router
    // ======================================================================
    const parseHash = () => {
      const raw = location.hash.replace(/^#/, '') || 'signup';
      const [path, queryStr] = raw.split('?');
      const query = {};
      if (queryStr) {
        for (const part of queryStr.split('&')) {
          const [k, v] = part.split('=');
          if (k) query[decodeURIComponent(k)] = decodeURIComponent(v || '');
        }
      }
      return { path, query };
    };

    const navigate = (hash) => {
      if (location.hash === hash) { render(); } else { location.hash = hash; }
    };

    const render = () => {
      const { path, query } = parseHash();

      if (path === 'signup') {
        setBodyClass('signup-bg');
        renderSignup();
        return;
      }

      if (!state.user) {
        navigate('#signup');
        return;
      }

      setBodyClass('');
      if (path === 'dashboard') renderDashboard();
      else if (path === 'kyc')  renderKyc(query);
      else navigate('#dashboard');
    };

    window.addEventListener('hashchange', render);

    // ======================================================================
    // api (mock)
    // ======================================================================
    const delay = (ms) => new Promise((r) => setTimeout(r, ms));

    // TODO: Replace with real API call to POST /api/v1/users/signup
    const apiSignup = async (payload) => {
      await delay(1200);
      return { ok: true, user_id: `u_${Math.random().toString(36).slice(2, 10)}`, ...payload };
    };

    // TODO: Replace with real API call to POST /api/v1/kyc/manual
    const apiSubmitManualKyc = async (_payload) => {
      await delay(1500);
      return { ok: true, status: 'pending' };
    };

    // Real call to LockBox public verify API — hidden from the user.
    // POST http://localhost:5000/api/v1/verify/user
    //   Headers: X-API-Key: <lbx_live_...>     // API_KEY_PLACEHOLDER
    //   Body:    { firstName, lastName, phone }
    //   Returns: { verified: boolean, user?: {...} }
    const LOCKBOX_API_BASE = 'http://localhost:5000';
    const LOCKBOX_API_KEY  = 'lbx_live_F0PRO2Wjv_kMrwHJ7EcnLe6ywNHQ0pft'; // API_KEY_PLACEHOLDER
    const apiVerifyLockbox = async ({ given_name, family_name, phone }) => {
      const api_key = LOCKBOX_API_KEY;
      try {
        const res = await fetch(`${LOCKBOX_API_BASE}/api/v1/verify/user`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-API-Key': api_key, // API_KEY_PLACEHOLDER
          },
          body: JSON.stringify({
            firstName: given_name,
            lastName:  family_name,
            phone:     phone,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          return { ok: false, status: 'error', error: data.error || `HTTP ${res.status}` };
        }
        return {
          ok: true,
          status: data.verified ? 'verified' : 'unverified',
          user: data.user || null,
        };
      } catch (err) {
        return { ok: false, status: 'error', error: 'Could not reach LockBox API. Is the server running on :5000?' };
      }
    };

    // ======================================================================
    // views
    // ======================================================================
    function renderHeader() {
      const name = state.user ? escapeHtml(`${state.user.given_name} ${state.user.family_name}`) : '';
      return `
        <header class="app-header">
          <a href="#dashboard" class="brand" aria-label="Test Sewa home">
            ${logoSVG(28)}
            <span class="brand-text">Test Sewa</span>
          </a>
          <div class="header-spacer"></div>
          <span class="user-chip" title="${escapeHtml(state.user?.email || '')}">
            <strong>${name}</strong>
          </span>
          ${themeToggleBtn()}
          <button class="btn btn-ghost btn-sm" type="button" data-action="logout" title="Sign out">
            ${icon('logout', 14)}<span>Sign out</span>
          </button>
        </header>`;
    }

    // ---------- Signup ----------
    function renderSignup() {
      $app().innerHTML = `
        <section class="signup-shell" aria-labelledby="signup-title">
          <div class="signup-corner-toggle">${themeToggleBtn()}</div>
          <div class="signup-card card">
            <div class="brand-row">
              <span style="color: var(--color-primary)">${logoSVG(48)}</span>
              <div>
                <h1 id="signup-title">Create your Test Sewa account</h1>
                <p class="subtitle">Sign up to begin testing KYC verification flows.</p>
              </div>
            </div>

            <form id="signup-form" novalidate>
              <div class="form-grid">
                <div class="row" style="gap: var(--space-3)">
                  <div class="field" style="flex:1">
                    <label for="f-given">First Name</label>
                    <input class="input" id="f-given" name="given_name" type="text" autocomplete="given-name" required />
                    <p class="helper error hidden" data-error-for="given_name"></p>
                  </div>
                  <div class="field" style="flex:1">
                    <label for="f-family">Last Name</label>
                    <input class="input" id="f-family" name="family_name" type="text" autocomplete="family-name" required />
                    <p class="helper error hidden" data-error-for="family_name"></p>
                  </div>
                </div>

                <div class="field">
                  <label for="f-phone">Phone Number</label>
                  <input class="input" id="f-phone" name="phone" type="tel"
                         autocomplete="tel" placeholder="+977-XXXXXXXXXX" required />
                  <p class="helper error hidden" data-error-for="phone"></p>
                </div>

                <div class="field">
                  <label for="f-email">Email</label>
                  <input class="input" id="f-email" name="email" type="email" autocomplete="email" required />
                  <p class="helper error hidden" data-error-for="email"></p>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Create account</button>
              </div>
            </form>

            <p class="signup-footer">
              Already have an account? <a href="#" data-action="noop-login">Log in</a>
            </p>
          </div>
        </section>`;

      document.getElementById('signup-form').addEventListener('submit', onSignupSubmit);
    }

    async function onSignupSubmit(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const data = Object.fromEntries(new FormData(form).entries());
      const errors = validateSignup(data);

      // clear previous errors
      form.querySelectorAll('[data-error-for]').forEach((n) => { n.classList.add('hidden'); n.textContent = ''; });
      form.querySelectorAll('.input').forEach((i) => i.removeAttribute('aria-invalid'));

      if (Object.keys(errors).length) {
        for (const [k, v] of Object.entries(errors)) {
          const err = form.querySelector(`[data-error-for="${k}"]`);
          const input = form.querySelector(`[name="${k}"]`);
          if (err)   { err.textContent = v; err.classList.remove('hidden'); }
          if (input) { input.setAttribute('aria-invalid', 'true'); }
        }
        return;
      }

      const submitBtn = document.getElementById('signup-submit');
      setButtonLoading(submitBtn, true, 'Creating…');

      /*  Payload for reference — wire to real API later:
          {
            "given_name":  "...",
            "family_name": "...",
            "phone":       "...",
            "email":       "..."
          }
      */
      const res = await apiSignup(data);
      setButtonLoading(submitBtn, false);

      if (res.ok) {
        state.user = {
          given_name: data.given_name.trim(),
          family_name: data.family_name.trim(),
          phone: data.phone.trim(),
          email: data.email.trim(),
          user_id: res.user_id,
        };
        state.kycStatus = 'unverified';
        toast('Account created successfully!', 'success');
        navigate('#dashboard');
      } else {
        toast('Could not create account. Please try again.', 'danger');
      }
    }

    function validateSignup(d) {
      const errs = {};
      if (!d.given_name?.trim())  errs.given_name  = 'First name is required.';
      if (!d.family_name?.trim()) errs.family_name = 'Last name is required.';
      if (!d.phone?.trim())       errs.phone       = 'Phone number is required.';
      else if (!/^[+0-9()\-\s]{7,20}$/.test(d.phone.trim())) errs.phone = 'Enter a valid phone number.';
      if (!d.email?.trim())       errs.email       = 'Email is required.';
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) errs.email = 'Enter a valid email address.';
      return errs;
    }

    // ---------- Dashboard ----------
    function kycChip() {
      if (state.kycStatus === 'verified') return `<span class="chip chip-success">${icon('check',12)} Verified</span>`;
      if (state.kycStatus === 'pending')  return `<span class="chip chip-warning">${icon('info',12)} Pending review</span>`;
      return `<span class="chip chip-warning">${icon('alert',12)} Unverified</span>`;
    }

    function renderDashboard() {
      const u = state.user;
      $app().innerHTML = `
        <div class="app-shell">
          ${renderHeader()}
          <main class="dashboard-main" aria-labelledby="welcome-title">
            <section class="card welcome-card">
              <div class="row-between">
                <div>
                  <h1 id="welcome-title">Welcome, ${escapeHtml(u.given_name)}!</h1>
                  <p class="muted" style="font-size: var(--text-sm); margin-top: var(--space-1);">
                    Your account details and verification status.
                  </p>
                </div>
              </div>

              <div class="info-rows">
                <div class="info-row"><span>Email</span><span>${escapeHtml(u.email)}</span></div>
                <div class="info-row"><span>Phone</span><span>${escapeHtml(u.phone)}</span></div>
              </div>

              <div class="status-row">
                <span class="label">KYC Status</span>
                ${kycChip()}
              </div>
            </section>

            <div class="section-heading">
              <h2>Verify Your Identity</h2>
              <p class="muted" style="font-size: var(--text-sm); margin-top: var(--space-1);">
                Choose a method to complete KYC verification.
              </p>
            </div>

            <div class="kyc-options">
              <article class="option-card">
                <span class="option-icon">${icon('clipboard', 22)}</span>
                <div class="option-title-row"><h3>Manual Verification</h3></div>
                <p class="option-desc">Upload your documents and our team will review them within 24–48 hours.</p>
                <button class="btn btn-secondary" data-action="go-kyc" data-method="manual">Start Manual KYC</button>
              </article>

              <article class="option-card">
                <span class="option-icon">${icon('shield', 22)}</span>
                <div class="option-title-row">
                  <h3>Instant Verification</h3>
                  <span class="chip chip-primary">Instant</span>
                </div>
                <p class="option-desc">Verify your identity instantly with a one-time code sent to your phone.</p>
                <button class="btn btn-primary" data-action="go-kyc" data-method="lockbox">Start Instant Verification</button>
              </article>
            </div>
          </main>
        </div>`;
    }

    // ---------- KYC ----------
    function renderKyc(query) {
      const method = query.method === 'lockbox' ? 'lockbox' : 'manual';
      $app().innerHTML = `
        <div class="app-shell">
          ${renderHeader()}
          <main class="kyc-main ${method === 'lockbox' ? 'narrow' : ''}">
            <a href="#dashboard" class="back-link" data-action="back-dashboard">
              ${icon('arrowLeft', 14)} Back to Dashboard
            </a>
            <div id="kyc-body"></div>
          </main>
        </div>`;

      if (method === 'manual') renderManualKyc();
      else renderLockboxKyc();
    }

    function renderManualKyc() {
      document.getElementById('kyc-body').innerHTML = `
        <section class="card" aria-labelledby="manual-title">
          <div class="card-heading">
            <h1 id="manual-title">Manual KYC Verification</h1>
            <p>Upload a government-issued ID. Our team will review within 24–48 hours.</p>
          </div>

          <form id="manual-form" class="form-grid" novalidate>
            <div class="field">
              <label for="doc-type">Document Type</label>
              <select id="doc-type" name="document_type" class="select" required>
                <option value="national_id">National ID</option>
                <option value="passport">Passport</option>
                <option value="drivers_license">Driver's License</option>
              </select>
            </div>

            <div class="field">
              <label for="doc-number">Document Number</label>
              <input id="doc-number" name="document_number" class="input" type="text" required />
            </div>

            <div class="field">
              <label for="dob">Date of Birth</label>
              <input id="dob" name="date_of_birth" class="input" type="date" required />
            </div>

            ${dropzoneHtml('front', 'Front of Document')}
            ${dropzoneHtml('back',  'Back of Document')}

            <button type="submit" class="btn btn-primary btn-block" id="manual-submit">Submit for Review</button>
          </form>
        </section>`;

      wireDropzones();
      document.getElementById('manual-form').addEventListener('submit', onManualSubmit);
    }

    function dropzoneHtml(side, label) {
      return `
        <div class="field">
          <label>${label}</label>
          <label class="dropzone" data-dropzone="${side}" tabindex="0" role="button" aria-label="${label} upload">
            ${icon('upload', 20)}
            <span class="dz-label">Click or drop a file here</span>
            <span class="helper">PNG, JPG, or PDF — up to 10 MB</span>
            <input type="file" accept="image/*,.pdf" name="${side}" />
          </label>
        </div>`;
    }

    function wireDropzones() {
      document.querySelectorAll('[data-dropzone]').forEach((zone) => {
        const input = zone.querySelector('input[type=file]');
        const label = zone.querySelector('.dz-label');

        const onChoose = (file) => {
          if (!file) return;
          zone.classList.add('has-file');
          label.innerHTML = `<span class="file-name">${escapeHtml(file.name)}</span>`;
        };

        input.addEventListener('change', () => onChoose(input.files?.[0]));

        ['dragenter','dragover'].forEach((ev) =>
          zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add('drag-over'); }));
        ['dragleave','drop'].forEach((ev) =>
          zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.remove('drag-over'); }));
        zone.addEventListener('drop', (e) => {
          const file = e.dataTransfer?.files?.[0];
          if (file) {
            try {
              const dt = new DataTransfer();
              dt.items.add(file);
              input.files = dt.files;
            } catch {}
            onChoose(file);
          }
        });

        zone.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
        });
      });
    }

    async function onManualSubmit(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const submit = document.getElementById('manual-submit');
      const data = Object.fromEntries(new FormData(form).entries());

      if (!data.document_number?.trim() || !data.date_of_birth) {
        toast('Please fill in all required fields.', 'warning');
        return;
      }

      setButtonLoading(submit, true, 'Submitting…');
      const res = await apiSubmitManualKyc(data);
      setButtonLoading(submit, false);

      if (res.ok) {
        state.kycStatus = 'pending';
        renderManualSuccess();
      }
    }

    function renderManualSuccess() {
      document.getElementById('kyc-body').innerHTML = `
        <section class="card success-state" aria-live="polite">
          <div class="check-circle">${icon('checkBig', 40)}</div>
          <h2>Documents submitted</h2>
          <p>Your documents have been submitted. We'll notify you within 24–48 hours.</p>
          <div class="mt-6">
            <a href="#dashboard" class="btn btn-primary">Back to Dashboard</a>
          </div>
        </section>`;
    }

    function maskPhone(p) {
      const digits = String(p || '').replace(/\D/g, '');
      if (digits.length < 4) return p || '';
      const last = digits.slice(-3);
      return `${p.slice(0, 4)} ••• ••• ${last}`;
    }

    function renderLockboxKyc() {
      const phone = state.user.phone;
      document.getElementById('kyc-body').innerHTML = `
        <section class="card" aria-labelledby="otp-title">
          <div class="card-heading">
            <h1 id="otp-title">Instant Verification</h1>
            <p>We've sent a 4-digit code to <strong>${escapeHtml(maskPhone(phone))}</strong>. Enter it below to verify your identity.</p>
          </div>

          <form id="otp-form" class="form-grid" novalidate>
            <div class="field">
              <label for="otp-input">One-time code</label>
              <input id="otp-input" name="otp" class="input" type="text" inputmode="numeric"
                     autocomplete="one-time-code" maxlength="4" pattern="\\d{4}"
                     placeholder="1234" required
                     style="letter-spacing: 0.4em; font-size: var(--text-lg); text-align: center;" />
              <p class="helper">Didn't get it? <a href="#" data-action="resend-otp">Resend code</a></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="otp-submit">
              ${icon('shield', 16)} Verify
            </button>
          </form>
        </section>`;

      const input = document.getElementById('otp-input');
      input.focus();
      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 4);
      });

      document.getElementById('otp-form').addEventListener('submit', onOtpSubmit);
    }

    async function onOtpSubmit(e) {
      e.preventDefault();
      const submit = document.getElementById('otp-submit');
      const otp = document.getElementById('otp-input').value.trim();

      if (!/^\d{4}$/.test(otp)) {
        toast('Enter the 4-digit code sent to your phone.', 'warning');
        return;
      }

      setButtonLoading(submit, true, 'Verifying…');
      // Behind the scenes: real LockBox verification. OTP itself is UX theater —
      // the actual gate is whether the signup name + phone match a LockBox user
      // with at least one verified document.
      const res = await apiVerifyLockbox({
        given_name: state.user.given_name,
        family_name: state.user.family_name,
        phone: state.user.phone,
      });
      setButtonLoading(submit, false);

      if (res.ok && res.status === 'verified') {
        state.kycStatus = 'verified';
        renderLockboxSuccess();
      } else if (res.ok && res.status === 'unverified') {
        toast('We couldn\u2019t verify your identity. Please check your details and try again.', 'danger');
      } else {
        toast(res.error || 'Verification failed. Please try again.', 'danger');
      }
    }

    function renderLockboxSuccess() {
      document.getElementById('kyc-body').innerHTML = `
        <section class="card success-state" aria-live="polite">
          <div class="check-circle">${icon('checkBig', 40)}</div>
          <h2>Identity Verified!</h2>
          <p>Your LockBox identity verification is complete. Redirecting to dashboard…</p>
        </section>`;
      toast('KYC verified via LockBox.', 'success');
      setTimeout(() => navigate('#dashboard'), 3000);
    }

    // ======================================================================
    // global event delegation
    // ======================================================================
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'toggle-theme') {
        applyTheme(state.theme === 'dark' ? 'light' : 'dark');
        render();
        return;
      }

      if (action === 'logout') {
        state.user = null;
        state.kycStatus = 'unverified';
        toast('Signed out.', 'default');
        navigate('#signup');
        return;
      }

      if (action === 'go-kyc') {
        const m = target.dataset.method || 'manual';
        navigate(`#kyc?method=${m}`);
        return;
      }

      if (action === 'back-dashboard') {
        // default anchor navigation already handles this
        return;
      }

      if (action === 'noop-login') {
        e.preventDefault();
        toast('Login flow is not part of this test client.', 'default');
        return;
      }

      if (action === 'resend-otp') {
        e.preventDefault();
        toast(`Code resent to ${maskPhone(state.user.phone)}.`, 'success');
        return;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const { path } = parseHash();
      if (path === 'kyc') navigate('#dashboard');
    });

    // ======================================================================
    // boot
    // ======================================================================
    if (!location.hash) location.hash = 'signup';
    render();
  })();
  </script>
</body>
</html>
